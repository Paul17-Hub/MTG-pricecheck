name: Dagelijkse prijs-sync en publicatie
on:
  schedule: [{ cron: '30 5 * * *' }]   # elke dag 05:30 UTC (Cardmarket ververst rond 02:40 NL-tijd)
  workflow_dispatch: {}
  push: { branches: [main] }
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/sync.mjs
      - run: |
          mkdir site && cp index.html sw.js manifest.webmanifest icon-*.png site/ && cp -r data site/
          cp decks-data.json site/data/decks.json 2>/dev/null || echo 'Nog geen decks opgeslagen'
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
